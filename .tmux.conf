# start with window 1 (instead of 0)
set -g base-index 1

# start with pane 1
set -g pane-base-index 1

# open new windows in the current path
bind c new-window -c "#{pane_current_path}"

# rename window
bind r command-prompt -I "#W" "rename-window '%%'"

unbind p
bind p previous-window

# shorten command delay
set -sg escape-time 1

# don't rename windows automatically
set -g allow-rename off

# mouse control (clickable windows, panes, resizable panes)
set -g mouse on

# Use Alt-arrow keys without prefix key to switch panes
bind -n M-Left select-pane -L
bind -n M-Right select-pane -R
bind -n M-Up select-pane -U
bind -n M-Down select-pane -D

# Use Shift-arrow keys without prefix key to switch windows
bind -n S-Left  previous-window
bind -n S-Right next-window

# set default terminal mode to 256 colors
set -g default-terminal "xterm-256color"
set -ga terminal-overrides ",xterm-256color:Tc"

# allow focus events to get through to applications running in tmux
set -g focus-events on

 
# Design Tweaks
# -------------

# panes
set -g pane-border-style 'fg=colour10'
set -g pane-active-border-style 'fg=colour3'

# statusbar
set -g status-position bottom
set -g status-justify left
set -g status-style 'bg=default fg=colour10'

#set -g status-left "  "
#set -g status-left-length 50

#set -g status-right "#[bg=colour235,fg=colour255] #[bg=colour235,fg=colour255]"
#set -g status-right-length 0

# messages
set -g message-style 'fg=colour0 bg=colour2'

# Large scrollback
set -g history-limit 100000

# remove right click menu
unbind -n MouseDown3Pane

bind -T copy-mode MouseDragEnd1Pane send -X copy-pipe-and-cancel
bind -T copy-mode-vi MouseDragEnd1Pane send -X copy-pipe-and-cancel

# Send tmux copies to the X11 clipboard
set -s copy-command 'xsel -bi'
